name: Speak private CI image builds

on:
  workflow_call:
    inputs:
      target:
        description: Image build selected by the private CI dispatcher
        required: true
        type: string
      checkout_repository:
        description: Source repository to check out
        required: true
        type: string
      checkout_ref:
        description: Source ref to check out
        required: true
        type: string
      registry:
        description: OCI registry hostname
        required: true
        type: string
      image_name:
        description: API image name without registry
        required: true
        type: string
      web_image_name:
        description: Web image name without registry
        required: true
        type: string
      publish_image:
        description: Whether the build pushes multi-architecture images
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  CHECKOUT_REPOSITORY: ${{ inputs.checkout_repository }}
  CHECKOUT_REF: ${{ inputs.checkout_ref }}

jobs:
  build-api:
    if: inputs.target == 'build-api'
    timeout-minutes: 9
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Resolve image tags
        id: image_tags
        run: |
          set -euo pipefail

          ref_input='${{ inputs.checkout_ref }}'
          ref_name="$ref_input"
          latest=false

          if [[ "$ref_input" == refs/tags/* ]]; then
            ref_name="${ref_input#refs/tags/}"
            latest=true
          elif [[ "$ref_input" == refs/heads/* ]]; then
            ref_name="${ref_input#refs/heads/}"
            if [[ "$ref_name" == "main" ]]; then
              latest=true
            fi
          elif [[ "$ref_input" == refs/pull/* ]]; then
            ref_name="pr-${ref_input#refs/pull/}"
            ref_name="${ref_name%%/*}"
          elif [[ "$ref_input" == v* ]]; then
            ref_name="$ref_input"
            latest=true
          elif [[ "$ref_input" == "main" ]]; then
            ref_name=main
            latest=true
          elif [[ -z "$ref_input" ]]; then
            ref_name=detached
          fi

          tag_name="$(printf '%s' "$ref_name" | sed 's/[^A-Za-z0-9_.-]/-/g')"

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.publish_image
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: inputs.publish_image
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ steps.image_tags.outputs.tag_name }}
            type=raw,value=sha-${{ steps.image_tags.outputs.short_sha }}
            type=raw,value=latest,enable=${{ steps.image_tags.outputs.latest == 'true' }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.publish_image && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.publish_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    if: inputs.target == 'build-web'
    timeout-minutes: 9
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Resolve image tags
        id: image_tags
        run: |
          set -euo pipefail

          ref_input='${{ inputs.checkout_ref }}'
          ref_name="$ref_input"
          latest=false

          if [[ "$ref_input" == refs/tags/* ]]; then
            ref_name="${ref_input#refs/tags/}"
            latest=true
          elif [[ "$ref_input" == refs/heads/* ]]; then
            ref_name="${ref_input#refs/heads/}"
            if [[ "$ref_name" == "main" ]]; then
              latest=true
            fi
          elif [[ "$ref_input" == refs/pull/* ]]; then
            ref_name="pr-${ref_input#refs/pull/}"
            ref_name="${ref_name%%/*}"
          elif [[ "$ref_input" == v* ]]; then
            ref_name="$ref_input"
            latest=true
          elif [[ "$ref_input" == "main" ]]; then
            ref_name=main
            latest=true
          elif [[ -z "$ref_input" ]]; then
            ref_name=detached
          fi

          tag_name="$(printf '%s' "$ref_name" | sed 's/[^A-Za-z0-9_.-]/-/g')"

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.publish_image
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: inputs.publish_image
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (web)
        id: meta_web
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.web_image_name }}
          tags: |
            type=raw,value=web-${{ steps.image_tags.outputs.tag_name }}
            type=raw,value=web-sha-${{ steps.image_tags.outputs.short_sha }}
            type=raw,value=web-latest,enable=${{ steps.image_tags.outputs.latest == 'true' }}

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: ${{ inputs.publish_image && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.publish_image }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
