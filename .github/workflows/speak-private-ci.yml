name: Speak Private CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or full ref from panda-lingo/speak to build
        required: false
        type: string
        default: main
      publish_image:
        description: Push images to GHCR under panda-lingo/speak
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  test-private-ci-workflow:
    timeout-minutes: 9
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI workflow
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate CI workflow contract
        run: ./scripts/test-private-ci-workflow.sh

  test-api:
    uses: ./.github/workflows/private-ci-api.yml
    with:
      target: test-api
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-api-ai-text-live:
    uses: ./.github/workflows/private-ci-api.yml
    with:
      target: test-api-ai-text-live
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-api-mm-gateway-e2e:
    uses: ./.github/workflows/private-ci-api.yml
    with:
      target: test-api-mm-gateway-e2e
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-api-omni-audio-e2e:
    uses: ./.github/workflows/private-ci-api.yml
    with:
      target: test-api-omni-audio-e2e
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-proxy:
    uses: ./.github/workflows/private-ci-standalone.yml
    with:
      target: test-proxy
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-standalone-mm-gateway:
    uses: ./.github/workflows/private-ci-standalone.yml
    with:
      target: test-standalone-mm-gateway
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-standalone-operations:
    uses: ./.github/workflows/private-ci-standalone.yml
    with:
      target: test-standalone-operations
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-local-compose-security:
    uses: ./.github/workflows/private-ci-standalone.yml
    with:
      target: test-local-compose-security
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-web:
    uses: ./.github/workflows/private-ci-web-browser.yml
    with:
      target: test-web
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-web-sites:
    uses: ./.github/workflows/private-ci-web-browser.yml
    with:
      target: test-web-sites
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-web-base-path:
    uses: ./.github/workflows/private-ci-web-browser.yml
    with:
      target: test-web-base-path
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-web-ai-text-live:
    needs: test-api-ai-text-live
    uses: ./.github/workflows/private-ci-web-live.yml
    with:
      target: test-web-ai-text-live
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-web-live-talk-live:
    uses: ./.github/workflows/private-ci-web-live.yml
    with:
      target: test-web-live-talk-live
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-web-e2e:
    uses: ./.github/workflows/private-ci-web-e2e.yml
    with:
      target: test-web-e2e
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  test-web-e2e-redroid-mobile:
    uses: ./.github/workflows/private-ci-web-e2e.yml
    with:
      target: test-web-e2e-redroid-mobile
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
    secrets: inherit

  quality-gate:
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - test-private-ci-workflow
      - test-api
      - test-api-ai-text-live
      - test-api-mm-gateway-e2e
      - test-api-omni-audio-e2e
      - test-proxy
      - test-standalone-mm-gateway
      - test-standalone-operations
      - test-local-compose-security
      - test-web
      - test-web-sites
      - test-web-base-path
      - test-web-ai-text-live
      - test-web-live-talk-live
      - test-web-e2e
      - test-web-e2e-redroid-mobile
    steps:
      - name: Require every test job
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<<"$REQUIRED_RESULTS"

  build-api:
    needs: quality-gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/private-ci-build.yml
    with:
      target: build-api
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
      registry: ghcr.io
      image_name: panda-lingo/speak
      web_image_name: panda-lingo/speak
      publish_image: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    secrets: inherit

  build-web:
    needs: quality-gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/private-ci-build.yml
    with:
      target: build-web
      checkout_repository: panda-lingo/speak
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
      registry: ghcr.io
      image_name: panda-lingo/speak
      web_image_name: panda-lingo/speak
      publish_image: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    secrets: inherit
