name: Speak private CI live web checks

on:
  workflow_call:
    inputs:
      target:
        description: Live web check selected by the private CI dispatcher
        required: true
        type: string
      checkout_repository:
        description: Source repository to check out
        required: true
        type: string
      checkout_ref:
        description: Source ref to check out
        required: true
        type: string

permissions:
  contents: read

env:
  CHECKOUT_REPOSITORY: ${{ inputs.checkout_repository }}
  CHECKOUT_REF: ${{ inputs.checkout_ref }}

jobs:
  test-web-ai-text-live:
    if: inputs.target == 'test-web-ai-text-live'
    name: test-web-ai-text-live (${{ matrix.scenario }})
    timeout-minutes: 9
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario: [practice, reader-text, reader-image, music, rss, pet]
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Set up Chrome browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: false

      - name: Verify Chrome browser
        run: '"${{ steps.setup-chrome.outputs.chrome-path }}" --version'

      - name: Run live AI text browser e2e
        env:
          IMAGE_TEXT_API_KEY: ${{ secrets.IMAGE_TEXT_API_KEY }}
          IMAGE_TEXT_BASE_URL: ${{ vars.IMAGE_TEXT_BASE_URL }}
          IMAGE_TEXT_MODEL: ${{ vars.IMAGE_TEXT_MODEL }}
          IMAGE_TEXT_API_FORMAT: ${{ vars.IMAGE_TEXT_API_FORMAT }}
          LIVE_AI_SCENARIO: ${{ matrix.scenario }}
          PLAYWRIGHT_BROWSER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE_TEXT_API_KEY:-}" || -z "${IMAGE_TEXT_BASE_URL:-}" || -z "${IMAGE_TEXT_MODEL:-}" || -z "${IMAGE_TEXT_API_FORMAT:-}" ]]; then
            echo "IMAGE_TEXT_* GitHub configuration is incomplete; skipping live AI text browser e2e." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ../scripts/validate-live-ai-text-config.sh
          echo "Running live AI browser scenario: $LIVE_AI_SCENARIO" | tee -a "$GITHUB_STEP_SUMMARY"
          npm run test:e2e:ci:ai-text-live

      - name: Upload live AI text browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ai-text-live-${{ matrix.scenario }}-attempt-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload live AI text postflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-observability-ai-text-${{ matrix.scenario }}-attempt-${{ github.run_attempt }}
          path: .tmp/e2e/observability
          if-no-files-found: ignore
          retention-days: 7

  test-web-live-talk-live:
    if: inputs.target == 'test-web-live-talk-live'
    timeout-minutes: 9
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Set up Chrome browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          # GitHub-hosted Ubuntu already includes Chrome's shared libraries.
          # Avoid setup-chrome's unbounded apt-get update before this 9-minute
          # real-provider journey; the next step proves the binary launches.
          install-dependencies: false

      - name: Verify Chrome browser
        run: '"${{ steps.setup-chrome.outputs.chrome-path }}" --version'

      - name: Run real Live Talk browser e2e
        env:
          LIVE_TALK_API_KEY: ${{ secrets.LIVE_TALK_API_KEY }}
          LIVE_TALK_BASE_URL: ${{ vars.LIVE_TALK_BASE_URL }}
          LIVE_TALK_MODEL: ${{ vars.LIVE_TALK_MODEL }}
          LIVE_TALK_API_FORMAT: ${{ vars.LIVE_TALK_API_FORMAT }}
          PLAYWRIGHT_BROWSER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          for name in LIVE_TALK_API_KEY LIVE_TALK_BASE_URL LIVE_TALK_MODEL LIVE_TALK_API_FORMAT; do
            if [[ -z "${!name:-}" ]]; then
              echo "LIVE_TALK_* GitHub configuration is incomplete; skipping real Live Talk browser e2e." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          ../scripts/validate-live-talk-config.sh
          {
            echo "LIVE_TALK_API_FORMAT=$LIVE_TALK_API_FORMAT"
            echo "LIVE_TALK_MODEL=$LIVE_TALK_MODEL"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          npm run test:e2e:ci:live-talk-live

      - name: Upload real Live Talk browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-live-talk-live-attempt-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload real Live Talk postflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-observability-live-talk-attempt-${{ github.run_attempt }}
          path: .tmp/e2e/observability
          if-no-files-found: ignore
          retention-days: 7
